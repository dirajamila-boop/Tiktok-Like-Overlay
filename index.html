<!DOCTYPE html>

<html lang="nl">
  
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TikTok Like Overlay</title>

  <style>

    body {

      margin: 0;

      padding: 20px;

      background: transparent;

      font-family: Arial, sans-serif;

      color: white;

    }

    #likes {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }

    .like-item {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px 18px;

      background: rgba(20, 20, 20, 0.85);

      border-radius: 16px;

      width: fit-content;

      min-width: 280px;

      transition: opacity 0.4s ease;

    }

    .avatar {

      width: 52px;

      height: 52px;

      border-radius: 50%;

      object-fit: cover;

    }

    .nickname {

      font-size: 18px;

      font-weight: bold;

    }

    .count {

      margin-top: 5px;

      font-size: 15px;

      color: #ffb6c1;

    }

    .heart {

      color: #ff1744;

      font-size: 24px;

    }

  </style>

</head>

<body>

  <div id="likes"></div>

    const users = {};

    const resetTimers = {};

    const timers = {};

      let message;

      try {

        message = JSON.parse(event.data);

      }

      timers[userId] = setTimeout(() => {

     };

    socket.onopen = () => {

      console.log("WebSocket verbonden!");

    };

    socket.onerror = error => {

</body>

</html>
